# 대저 DIA 웹(GitHub Pages)용 식단 자동 갱신
#
# 설치 위치: 웹 빌드를 올리는 저장소의  .github/workflows/update-meals.yml
#
# 하는 일: 한국시간 06~20시 매시 정각쯤(깃허브 사정으로 몇 분~수십 분
# 늦을 수 있음) daonna.net에서 대저(rest_id=4) 이번 주/다음 주 식단을
# 받아 저장소의 meals/{그주월요일}.json 으로 저장한다. 내용이 바뀐
# 경우에만 커밋하고, 커밋되면 GitHub Pages가 자동으로 다시 배포된다.
# 앱(웹)은 이 파일을 먼저 읽고, 없을 때만 우회 서버로 직접 받아온다.
#
# 수동 실행: 저장소 > Actions > "식단 자동 갱신" > Run workflow

name: 식단 자동 갱신

on:
  schedule:
    - cron: '0 21-23,0-11 * * *'   # UTC 21~11시 = 한국시간 06~20시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-meals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이번 주 / 다음 주 식단 받기
        run: |
          mkdir -p meals
          today=$(TZ=Asia/Seoul date +%F)
          dow=$(TZ=Asia/Seoul date +%u)   # 월=1 ... 일=7
          for offset in 0 7; do
            monday=$(date -d "$today -$((dow-1)) days +${offset} days" +%Y%m%d)
            url="https://daonna.net/get_weekly_meals?date=${monday}&rest_id=4"
            if curl -fsS --max-time 20 "$url" -o /tmp/meals.json \
               && jq -e 'type == "array"' /tmp/meals.json > /dev/null; then
              jq -c . /tmp/meals.json > "meals/${monday}.json"
              echo "저장: meals/${monday}.json"
            else
              echo "건너뜀(받기 실패): ${monday}"
            fi
          done

          # 3주 넘게 지난 파일은 정리한다.
          cutoff=$(date -d "$today -21 days" +%Y%m%d)
          for f in meals/*.json; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .json)
            if [ "$name" \< "$cutoff" ]; then rm -f "$f"; fi
          done

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add meals
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "식단 자동 갱신"
            git push
          fi
